# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Show Swift version
        run: swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint

      - name: Test and generate coverage
        run: bundle exec fastlane ios test_and_summary --verbose

      - name: Upload Fastlane build log
        if: ${{ always() && hashFiles('fastlane/test_output/*.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-build-log
          path: fastlane/test_output/*.log

      - name: Upload xcresult bundle
        if: ${{ always() && hashFiles('fastlane/test_output/HTTPNetworkClient.xcresult/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output/HTTPNetworkClient.xcresult

      - name: Upload coverage summary
        if: ${{ always() && hashFiles('fastlane/test_output/coverage_summary.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: fastlane/test_output/coverage_summary.txt
